<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>Particle Sandbox</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0f1115;
        font-family: system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      #toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.75rem;
        padding-top: max(0.75rem, env(safe-area-inset-top, 0px));
        background: transparent;
      }

      #toolbar button {
        min-block-size: 44px;
        min-inline-size: 44px;
        padding: 0 0.9rem;
        border: 1px solid #2a2f3a;
        border-radius: 999px;
        background: #171a21;
        color: #e6e9ef;
        font-size: 1rem;
        touch-action: manipulation;
      }

      #toolbar button.active {
        background: #2c6ef2;
        border-color: #2c6ef2;
        color: white;
      }

      canvas {
        display: block;
        flex: 1;
        width: 100%;
        min-block-size: 0;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="toolbar"></div>
      <canvas id="sim"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
