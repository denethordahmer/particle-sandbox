<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>Particle Sandbox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #141821;
        --line: #262c38;
        --ink: #e8ecf3;
        --dim: #93a0b4;
        --accent: #d9a05b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
      }

      #stage {
        position: relative;
        flex: 1;
        min-block-size: 0;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 0%, #171b24 0%, #0f1115 62%);
      }

      #sim {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #hint {
        position: absolute;
        inset-inline: 0;
        top: 42%;
        text-align: center;
        color: var(--dim);
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        pointer-events: none;
        opacity: 1;
        transition: opacity 600ms ease;
      }

      #hint.gone {
        opacity: 0;
      }

      #controls {
        flex: none;
        padding: 0.5rem 0 0.5rem;
        padding-bottom: max(0.5rem, env(safe-area-inset-bottom, 0px));
        background: var(--panel);
        border-top: 1px solid var(--line);
      }

      #materials {
        display: flex;
        gap: 0.4rem;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.15rem 0.6rem 0.45rem;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
      }

      #materials::-webkit-scrollbar {
        display: none;
      }

      .chip {
        flex: none;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-block-size: 44px;
        padding: 0 0.7rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #1a1f29;
        color: var(--ink);
        font-size: 0.82rem;
        white-space: nowrap;
        touch-action: manipulation;
      }

      .chip .dot {
        inline-size: 14px;
        block-size: 14px;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 45%) inset;
      }

      .chip[aria-selected="true"] {
        border-color: var(--accent);
        background: #262019;
        box-shadow: 0 0 0 1px var(--accent) inset;
      }

      #row2 {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0 0.6rem;
      }

      #brushWrap {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex: 1;
        min-inline-size: 0;
        color: var(--dim);
        font-size: 0.8rem;
      }

      #brush {
        flex: 1;
        min-inline-size: 0;
        accent-color: var(--accent);
        block-size: 44px;
      }

      .btn {
        flex: none;
        min-inline-size: 44px;
        min-block-size: 44px;
        padding: 0 0.85rem;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #1a1f29;
        color: var(--ink);
        font-size: 0.85rem;
        touch-action: manipulation;
      }

      .btn[aria-pressed="true"] {
        background: #2a2119;
        border-color: var(--accent);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="sim"></canvas>
        <p id="hint">Tap or drag to pour</p>
      </div>
      <div id="controls">
        <div id="materials" role="listbox" aria-label="Materials"></div>
        <div id="row2">
          <label id="brushWrap" for="brush">
            Brush
            <input id="brush" type="range" min="1" max="14" value="4" />
          </label>
          <button class="btn" id="erase" type="button" aria-pressed="false">Erase</button>
          <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
          <button class="btn" id="clear" type="button">Clear</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
