<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1115" />
    <title>Particle Sandbox</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1115;
        --panel: #151a23;
        --panel-2: #1b2230;
        --line: #2a3240;
        --ink: #eef2f8;
        --dim: #9aa8bd;
        --accent: #d9a05b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
        height: 100dvh;
      }

      #topbar {
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.45rem 0.8rem;
        padding-top: max(0.45rem, env(safe-area-inset-top, 0px));
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }

      #brand {
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        color: var(--dim);
        white-space: nowrap;
      }

      #current {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-inline-size: 0;
        font-size: 0.85rem;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #current .dot {
        inline-size: 12px;
        block-size: 12px;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 50%) inset;
      }

      #stage {
        position: relative;
        flex: 1;
        min-block-size: 0;
        overflow: hidden;
        background: var(--bg);
      }

      #sim {
        display: block;
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      #hint {
        position: absolute;
        inset-inline: 0;
        top: 38%;
        margin: 0;
        text-align: center;
        color: var(--dim);
        font-size: 0.9rem;
        letter-spacing: 0.02em;
        pointer-events: none;
        opacity: 1;
        transition: opacity 500ms ease;
      }

      #hint.gone {
        opacity: 0;
      }

      #ring {
        position: absolute;
        border: 1.5px solid rgb(255 255 255 / 70%);
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 45%);
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, -50%);
      }

      #ring.on {
        opacity: 1;
      }

      #controls {
        flex: none;
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding-bottom: max(0.4rem, env(safe-area-inset-bottom, 0px));
      }

      #tabs {
        display: flex;
        gap: 0.2rem;
        padding: 0.4rem 0.4rem 0.25rem;
      }

      .tab {
        flex: 1 1 auto;
        min-inline-size: 0;
        min-block-size: 40px;
        padding: 0 0.1rem;
        border: 1px solid transparent;
        border-radius: 9px;
        background: transparent;
        color: var(--dim);
        font-size: 0.66rem;
        font-weight: 600;
        letter-spacing: 0;
        touch-action: manipulation;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .tab[aria-selected="true"] {
        color: var(--ink);
        background: var(--panel-2);
        border-color: var(--line);
      }

      #materials {
        display: flex;
        gap: 0.35rem;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 0.1rem 0.5rem 0.45rem;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
      }

      #materials::-webkit-scrollbar {
        display: none;
      }

      .chip {
        flex: none;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        min-block-size: 40px;
        padding: 0 0.65rem;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-2);
        color: var(--ink);
        font-size: 0.8rem;
        white-space: nowrap;
        touch-action: manipulation;
      }

      .chip .dot {
        inline-size: 13px;
        block-size: 13px;
        border-radius: 50%;
        box-shadow: 0 0 0 1px rgb(0 0 0 / 45%) inset;
      }

      .chip[aria-selected="true"] {
        border-color: var(--accent);
        background: #2a2118;
        box-shadow: 0 0 0 1px var(--accent) inset;
      }

      #row2 {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0 0.5rem;
      }

      #brushWrap {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        flex: 1 1 auto;
        min-inline-size: 0;
        color: var(--dim);
        font-size: 0.78rem;
        white-space: nowrap;
      }

      #brushVal {
        flex: none;
        min-inline-size: 1.6rem;
        text-align: center;
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }

      #brush {
        flex: 1 1 auto;
        min-inline-size: 0;
        accent-color: var(--accent);
        block-size: 40px;
      }

      .btn {
        flex: none;
        min-inline-size: 44px;
        min-block-size: 44px;
        padding: 0 0.7rem;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel-2);
        color: var(--ink);
        font-size: 0.82rem;
        touch-action: manipulation;
      }

      .btn[aria-pressed="true"] {
        background: #2a2118;
        border-color: var(--accent);
        color: var(--accent);
      }

      .btn:active,
      .chip:active,
      .tab:active {
        filter: brightness(1.25);
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <span id="brand">Particle Sandbox</span>
        <span id="current"><i class="dot"></i><span id="currentName">Sand</span></span>
      </header>

      <div id="stage">
        <canvas id="sim"></canvas>
        <p id="hint">Tap or drag to pour</p>
        <div id="ring"></div>
      </div>

      <div id="controls">
        <div id="tabs" role="tablist" aria-label="Material groups"></div>
        <div id="materials" role="listbox" aria-label="Materials"></div>
        <div id="row2">
          <label id="brushWrap" for="brush">
            Brush
            <input id="brush" type="range" min="1" max="14" value="4" />
            <span id="brushVal">4</span>
          </label>
          <button class="btn" id="erase" type="button" aria-pressed="false">Erase</button>
          <button class="btn" id="pause" type="button" aria-pressed="false">Pause</button>
          <button class="btn" id="clear" type="button">Clear</button>
        </div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
